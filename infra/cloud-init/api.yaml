#cloud-config
# API VM (Ubuntu 24.04): the base every deploy needs. D-02 extends this with the Caddy, Compose and
# deploy-user details; keep it small so a rebuilt VM comes up the same way.
package_update: true
package_upgrade: false

# Created now so the deploy user can join it before Docker is installed.
groups:
  - docker

users:
  - default
  # CI deploys as this user over SSH (key added by D-02); it may run docker, nothing else.
  - name: deploy
    shell: /bin/bash
    groups: [docker]
    lock_passwd: true

packages:
  - ca-certificates
  - curl
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/60-codearena.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  - path: /etc/fail2ban/jail.d/codearena.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  - systemctl restart ssh
  - systemctl enable --now fail2ban
