# Production stack on the API VM (D-02). Lives in /opt/codearena next to prod.env; the deploy
# pipeline uploads these files on every deploy, so the server always matches the repository.
# Run with: docker compose --env-file prod.env ...   (deploy.sh does this)
name: codearena

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    image: caddy:2
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      API_HOST: ${API_HOST}
      WEB_ORIGIN: ${WEB_ORIGIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *restart
    # Pinned by digest by the pipeline (deploy.sh refuses anything else), so a deploy and a rollback
    # always run exactly the bytes that were built.
    image: ${API_IMAGE:?API_IMAGE is set by deploy.sh}
    env_file: prod.env
    # Loopback only: deploy.sh health-checks here; the public path is Caddy.
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Telemetry (O-01): receives OTLP from the API (inside this network) and from the judges (private
  # address, port 4318), forwards to Grafana Cloud. Off until `set-grafana.sh` has stored the Grafana
  # settings: it is in a profile, so a plain `up` never starts it without them.
  otelcol:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.131.0
    profiles: ['observability']
    command: ['--config=/etc/otelcol/config.yaml']
    # Only the Grafana settings, not the rest of prod.env (database, signing keys).
    environment:
      GRAFANA_OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:-}
      GRAFANA_INSTANCE_ID: ${GRAFANA_INSTANCE_ID:-}
      GRAFANA_TOKEN: ${GRAFANA_TOKEN:-}
    ports: ['${API_PRIVATE_IP:?}:4318:4318']
    volumes:
      - ./otelcol.yaml:/etc/otelcol/config.yaml:ro

  # One-off: applies database migrations with the new image before the API is switched over.
  # `docker compose run --rm migrate`
  migrate:
    image: ${API_IMAGE:?API_IMAGE is set by deploy.sh}
    env_file: prod.env
    command: ['node', '--import', 'tsx', 'src/db/cli.ts', 'migrate']
    profiles: ['tools']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  # One-off (O-03): load-test users, contest, report and cleanup, run from tests/load/prod.sh.
  # `docker compose --profile tools run --rm -T loadtest seed --users 150 --out -`
  loadtest:
    image: ${API_IMAGE:?API_IMAGE is set by prod.sh}
    env_file: prod.env
    environment:
      LOAD_TEST: 'on'
    entrypoint: ['node', '--import', 'tsx', 'src/modules/load/load-cli.ts']
    profiles: ['tools']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  # Plagiarism job (PL-05): polls the API for plagiarism runs (started from the ops console), scores them on CPU
  # (tree-sitter fingerprints and UniXcoder embeddings) and posts the result. OFF by default: it needs its own image
  # (`docker build apps/plag`, the model is baked in) and the service token in prod.env, and runs only when started:
  # `PLAG_IMAGE=codearena-plag:<tag> docker compose --env-file prod.env --profile plag up -d plag`
  # It has no database, Redis or storage access: the API is its only contact, with the service token.
  plag:
    <<: *restart
    # Optional variables on purpose: Compose evaluates `${X:?}` for EVERY service, even in an inactive profile, so a
    # required one here would make every deploy and every `docker compose` command fail. The job itself refuses to run
    # without the token (`python -m plag serve` exits 2).
    image: ${PLAG_IMAGE:-codearena-plag:not-deployed}
    profiles: ['plag']
    environment:
      PLAG_SERVICE_TOKEN: ${PLAG_SERVICE_TOKEN:-}
    command: ['serve', '--api', 'http://api:4000']
    read_only: true
    tmpfs: ['/tmp']
    # A run must not starve the API and the judge's Redis on the same VM.
    cpus: 1.0
    mem_limit: 2g
    depends_on:
      api: { condition: service_healthy }

  postgres:
    <<: *restart
    image: postgres:16
    environment:
      POSTGRES_USER: codearena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: codearena
    # No published port: only containers on this Compose network can reach the database.
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codearena -d codearena -h 127.0.0.1']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?}
      REDIS_JUDGE_PASSWORD: ${REDIS_JUDGE_PASSWORD:?}
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?}
    volumes:
      - ./redis/users.acl.tmpl:/etc/redis/users.acl.tmpl:ro
      - ./redis/entrypoint.sh:/entrypoint.sh:ro
      - redisdata:/data
    entrypoint: ['sh', '/entrypoint.sh']
    # Reachable by the judges on the private subnet, never on the public address (the NSG also
    # only lets the judge subnet in).
    ports: ['${API_PRIVATE_IP:?}:6379:6379']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_ADMIN_PASSWORD" redis-cli --user admin ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    <<: *restart
    image: chrislusf/seaweedfs:4.00
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    environment:
      S3_API_ACCESS_KEY: ${S3_API_ACCESS_KEY:?}
      S3_API_SECRET_KEY: ${S3_API_SECRET_KEY:?}
      S3_JUDGE_ACCESS_KEY: ${S3_JUDGE_ACCESS_KEY:?}
      S3_JUDGE_SECRET_KEY: ${S3_JUDGE_SECRET_KEY:?}
    entrypoint:
      - sh
      - -c
      - >-
        sed -e "s|__API_AK__|$$S3_API_ACCESS_KEY|" -e "s|__API_SK__|$$S3_API_SECRET_KEY|"
        -e "s|__JUDGE_AK__|$$S3_JUDGE_ACCESS_KEY|" -e "s|__JUDGE_SK__|$$S3_JUDGE_SECRET_KEY|"
        /etc/seaweedfs/s3.json.tmpl > /etc/seaweedfs/s3.json && exec weed "$$@"
      - --
    volumes:
      - ./s3.json.tmpl:/etc/seaweedfs/s3.json.tmpl:ro
      - s3data:/data
    ports: ['${API_PRIVATE_IP:?}:8333:8333']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 30

  # One-off: makes sure the bucket exists. `docker compose run --rm s3-init`
  s3-init:
    image: amazon/aws-cli
    profiles: ['tools']
    restart: 'no'
    depends_on:
      s3: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_API_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_API_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - sh
      - -c
      - aws --endpoint-url http://s3:8333 s3api head-bucket --bucket codearena 2>/dev/null || aws --endpoint-url http://s3:8333 s3 mb s3://codearena

volumes:
  pgdata:
  redisdata:
  s3data:
  caddy_data:
  caddy_config:
